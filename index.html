<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

/* ── COLOR TOKENS ── */
:root {
  --primary: #002FA7;
  --accent:  #D0021B;
}
:root.hike-mode {
  --primary: #1B4D2E;
  --accent:  #D4720B;
}

/* ── GLOBAL TRANSITION for all themed elements ── */
.cal-frame, .cal-frame *,
.bottom-nav, .bottom-nav * {
  transition:
    color          0.3s ease,
    background-color 0.3s ease,
    border-color   0.3s ease,
    outline-color  0.3s ease,
    box-shadow     0.3s ease,
    fill           0.3s ease;
}

body {
  background: white;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding: 24px 12px;
  font-family: 'Roboto Condensed', sans-serif;
}

/* ── ABOVE-FOLD WRAPPER (desktop: transparent passthrough) ── */
.above-fold {
  display: contents;
}

/* ── OUTER FRAME ── */
.cal-frame {
  width: 100%;
  max-width: 860px;
  background: white;
  border: 5px solid var(--primary);
  box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--primary), 6px 6px 0 4px #000a;
  position: relative;
  padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px));
}

/* ── TOP BANNER ── */
.top-banner {
  background: #fff;
  border-bottom: 4px solid var(--primary);
  display: flex;
  align-items: stretch;
  position: sticky;
  top: 0;
  z-index: 100;
}
/* Banner nav row: arrows on sides, content centred */
.banner-nav-row {
  display: flex;
  align-items: stretch;
  width: 100%;
}
.banner-center {
  flex: 1;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 14px;
  min-width: 0;
  padding: 8px 0;
}
.banner-text {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  border-left: 2px solid rgba(0, 47, 167, 0.22);
  padding-left: 14px;
  overflow: hidden;
  min-width: 0;
}
/* Prominent nav arrows — SVG chevrons, always pixel-perfect centred */
.banner-nav-btn {
  background: none;
  border: none;
  color: var(--accent);
  cursor: pointer;
  padding: 0 20px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  align-self: stretch;
  transition: opacity 0.15s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.banner-nav-btn svg {
  width: 36px;
  height: 36px;
  display: block;
}
.banner-nav-btn:hover  { opacity: 0.6; }
.banner-nav-btn:active { opacity: 1; }
.banner-logo-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.banner-logo-row svg { height: 44px; width: auto; }
.banner-logo-row .nav-btn { font-size: 20px; padding: 4px 14px; line-height: 1; }
.banner-logo {
  height: 38px;
  width: auto;
  fill: var(--primary);
  display: block;
  flex-shrink: 0;
}
.banner-title {
  font-family: 'Archivo Black', sans-serif;
  font-size: 26px;
  letter-spacing: 2px;
  color: var(--primary);
  text-transform: uppercase;
  white-space: nowrap;
  flex-shrink: 0;
  line-height: 1;
}
.banner-sub {
  font-size: 12px;
  letter-spacing: 1.5px;
  color: var(--accent);
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
  line-height: 1;
}

/* ── MONTH/YEAR HEADER ── */
.month-header {
  display: grid;
  grid-template-columns: auto 1fr auto;
  background: white;
  padding: 6px;
  gap: 6px;
  position: sticky;
  top: var(--banner-h, 58px);
  z-index: 99;
}
.year-box {
  font-family: 'Archivo Black', sans-serif;
  font-size: 46px;
  color: white;
  text-align: center;
  padding: 2px 16px;
  letter-spacing: 1px;
  background: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
}
.month-name-box {
  font-family: 'Archivo Black', sans-serif;
  font-size: 46px;
  background: transparent;
  letter-spacing: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.month-name-text {
  background: var(--accent);
  color: white;
  padding: 2px 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  align-self: stretch;
  width: 100%;
}
.today-btn {
  font-family: 'Archivo Black', sans-serif;
  font-size: 46px;
  color: white;
  background: var(--primary);
  border: none;
  padding: 2px 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.15s, opacity 0.15s;
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap;
  display: flex;
  align-items: center;
  justify-content: center;
}
.today-btn:hover  { background: var(--accent); }
.today-btn:active { opacity: 0.8; }
/* Hidden when already on current month */
.today-btn.is-current-month { opacity: 0.32; pointer-events: none; }

/* ── NAV BUTTONS ── */
.nav-btn {
  background: white;
  color: var(--primary);
  border: none;
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1px;
  padding: 3px 14px;
  cursor: pointer;
  text-transform: uppercase;
}
.nav-btn:hover { background: var(--accent); color: white; }

/* ── DAY HEADERS ── */
.day-headers {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  padding: 4px 2px;
  margin: 0 6px;
  gap: 2px;
  background: var(--primary);
}
.dh {
  text-align: center;
  padding: 5px 0;
  font-family: 'Archivo Black', sans-serif;
  font-size: 20px;
  letter-spacing: 1px;
  background: white;
  color: var(--primary);
  border-radius: 5px;
}
.dh.sun-hdr { color: var(--accent); }

/* ── CALENDAR GRID ── */
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  padding: 4px 2px 6px;
  margin: 0 6px 6px;
  gap: 2px;
  background: var(--primary);
}

.day-cell {
  border-radius: 5px;
  min-height: 90px;
  padding: 3px 4px;
  position: relative;
  background: white;
  overflow: hidden;
  cursor: pointer;
}
.day-cell.blank {
  background: white;
  cursor: default;
  pointer-events: none;
}
.day-cell:not(.blank):hover { background: #f0f4ff; }

/* date number wrapper */
.date-num-wrap { position: relative; display: inline-block; }

.holiday-lbl {
  display: block;
  color: var(--accent);
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
  pointer-events: none;
  margin-top: 1px;
}

/* big date number */
.date-num {
  font-family: 'Archivo Black', sans-serif;
  font-size: 52px;
  line-height: 0.95;
  color: var(--primary);
}
.day-cell.is-sun .date-num { color: var(--accent); }
.day-cell.is-holiday .date-num { color: var(--accent); }

/* event pill */
.event-pill {
  margin-top: 2px;
  background: var(--accent);
  color: white;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 4px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  line-height: 1.3;
  cursor: pointer;
  border-radius: 1px;
  font-family: 'Roboto Condensed', sans-serif;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
  display: block;
}
.event-pill:hover { background: var(--primary); }

/* +N more events badge */
.more-badge {
  font-size: 9px;
  font-weight: 700;
  color: var(--primary);
  font-family: 'Oswald', sans-serif;
  letter-spacing: 0.5px;
  margin-top: 1px;
}


/* current date highlight — red border only, no background tint */
.day-cell.is-today { box-shadow: inset 0 0 0 3px var(--accent); }

/* ── BOTTOM SECTION ── */
.bottom-row {
  border-top: 3px solid var(--primary);
}

.mgh.s { color: var(--accent); }
.mgd { color: #333; }
.mgd.s { color: var(--accent); }
.mgd.today { background: var(--primary); color: white; border-radius: 50%; display: inline-block; width: 14px; height: 14px; line-height: 14px; }

/* center info */
.center-info { padding: 14px 0 14px; }

/* ── SECTION HEADER ROW — title + nav arrows ── */
.ev-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 10px 10px 14px;
  border-bottom: 1.5px solid var(--primary);
}

.ev-title {
  font-family: 'Archivo Black', sans-serif;
  font-size: 11px;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 2.5px;
  line-height: 1;
}

/* Nav arrow buttons — quiet helpers, not dominant */
.strip-nav {
  display: flex;
  gap: 2px;
  flex-shrink: 0;
}
.strip-nav-btn {
  background: none;
  border: 1.5px solid var(--primary);
  color: var(--primary);
  width: 22px;
  height: 22px;
  border-radius: 3px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
  -webkit-tap-highlight-color: transparent;
  flex-shrink: 0;
}
.strip-nav-btn:hover  { background: var(--primary); color: white; }
.strip-nav-btn:active { background: var(--accent); border-color: var(--accent); color: white; }
.strip-nav-btn:disabled { opacity: 0.22; cursor: default; pointer-events: none; }
.strip-nav-btn svg { display: block; width: 12px; height: 12px; }

/* ── SCROLL STRIP WRAPPER — handles edge fade ── */
.race-strip-wrap {
  position: relative;
}
/* right-edge fade: signals more cards exist */
.race-strip-wrap::after {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: 36px;
  background: linear-gradient(to right, transparent, white);
  pointer-events: none;
  z-index: 2;
  transition: opacity 0.2s;
}
/* left-edge fade: signals cards exist behind */
.race-strip-wrap::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  width: 20px;
  background: linear-gradient(to left, transparent, white);
  pointer-events: none;
  z-index: 2;
  opacity: 0;
  transition: opacity 0.2s;
}
.race-strip-wrap.at-start::before { opacity: 0; }
.race-strip-wrap.at-end::after    { opacity: 0; }
.race-strip-wrap.scrolled::before { opacity: 1; }

/* ── HORIZONTAL SCROLL STRIP ── */
.race-strip {
  display: flex;
  flex-direction: row;
  overflow-x: auto;
  overflow-y: hidden;
  gap: 8px;
  padding: 12px 40px 14px 14px;  /* right pad keeps last card clear of fade */
  scroll-snap-type: x proximity;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  cursor: grab;
}
.race-strip::-webkit-scrollbar { display: none; }
.race-strip.is-dragging {
  cursor: grabbing;
  scroll-snap-type: none;
  user-select: none;
}

/* Individual race card */
.race-card {
  flex: 0 0 auto;
  width: 158px;
  border: 1.5px solid var(--primary);
  border-radius: 4px;
  padding: 10px 11px 11px;
  cursor: pointer;
  scroll-snap-align: start;
  display: flex;
  flex-direction: column;
  gap: 5px;
  background: white;
  transition: background 0.1s, border-color 0.1s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  position: relative;
}
.race-card:hover  { background: #f0f4ff; }
.race-card:active { background: #dce6ff; }
.race-card.is-selected {
  background: #dce6ff;
  border-color: var(--accent);
}

/* Date block — compact, noticeable */
.rc-date {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: 10px;
  color: var(--accent);
  letter-spacing: 0.8px;
  text-transform: uppercase;
  line-height: 1;
}

/* Event name — primary focus */
.rc-name {
  font-family: 'Roboto Condensed', sans-serif;
  font-weight: 700;
  font-size: 12px;
  color: var(--primary);
  letter-spacing: 0.1px;
  line-height: 1.3;
  flex: 1;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Supporting detail — location + distance, visually secondary */
.rc-meta {
  font-family: 'Roboto Condensed', sans-serif;
  font-size: 11px;
  color: #666;
  letter-spacing: 0.1px;
  line-height: 1.4;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Divider between date and name */
.rc-div {
  height: 1px;
  background: #e0e6f5;
  margin: 1px 0;
  flex-shrink: 0;
}

/* "No events" state */
.race-strip-empty {
  padding: 10px 14px 6px;
  font-size: 11px;
  color: #777;
  font-family: 'Roboto Condensed', sans-serif;
  font-style: italic;
}

/* ── SEARCH / FILTER BAR ── */
.sf-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px 0;
  gap: 8px;
}
.sf-toggle-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: none;
  border: 1.5px solid var(--primary);
  color: var(--primary);
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 7px 12px;
  cursor: pointer;
  border-radius: 2px;
  transition: background 0.12s, color 0.12s;
  -webkit-tap-highlight-color: transparent;
  min-height: 44px;
}
.sf-toggle-btn:hover  { background: var(--primary); color: white; }
.sf-toggle-btn.is-open { background: var(--primary); color: white; }
.sf-clear-btn {
  background: none;
  border: 1.5px solid var(--accent);
  color: var(--accent);
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  padding: 7px 11px;
  cursor: pointer;
  border-radius: 2px;
  transition: background 0.12s, color 0.12s;
  -webkit-tap-highlight-color: transparent;
  min-height: 44px;
}
.sf-clear-btn:hover { background: var(--accent); color: white; }

/* ── SEARCH / FILTER PANEL ── */
.sf-panel {
  display: none;
  flex-direction: column;
  gap: 10px;
  padding: 12px 14px 14px;
  border-top: 1.5px solid var(--primary);
  margin-top: 8px;
}
.sf-panel.is-open { display: flex; }

.sf-search-row { display: flex; gap: 8px; align-items: center; }
.sf-input {
  flex: 1;
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--primary);
  background: white;
  border: 2px solid var(--primary);
  padding: 9px 12px;
  border-radius: 2px;
  outline: none;
  -webkit-appearance: none;
  min-height: 44px;
}
.sf-input::placeholder { color: #aaa; font-weight: 400; letter-spacing: 0.5px; }
.sf-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(208, 2, 27, 0.12); }

.sf-chips-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}
.sf-chips-lbl {
  font-family: 'Archivo Black', sans-serif;
  font-size: 9px;
  letter-spacing: 1.5px;
  color: #aaa;
  text-transform: uppercase;
  flex-shrink: 0;
  margin-right: 2px;
}
.sf-chip {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 5px 11px;
  border: 1.5px solid var(--primary);
  background: white;
  color: var(--primary);
  border-radius: 2px;
  cursor: pointer;
  transition: background 0.1s, color 0.1s;
  -webkit-tap-highlight-color: transparent;
  min-height: 36px;
  white-space: nowrap;
}
.sf-chip:hover  { background: #e8eeff; }
.sf-chip.is-active { background: var(--primary); color: white; }

.sf-results-label {
  font-family: 'Roboto Condensed', sans-serif;
  font-size: 11px;
  color: #888;
  font-style: italic;
  letter-spacing: 0.3px;
  min-height: 14px;
}
.sf-results-label.has-results { color: var(--accent); font-style: normal; font-weight: 700; }
.sf-results-label.no-results  { color: #999; }

/* Compatibility — keep .hol-row.is-selected for list-mode openEventDetailFromList */
.hol-row { display: flex; gap: 10px; cursor: pointer; border-radius: 2px; padding: 6px 5px; margin: 0 -3px 1px; -webkit-tap-highlight-color: transparent; transition: background 0.1s; align-items: flex-start; }
.hol-row.is-selected { background: #dce6ff; box-shadow: inset 3px 0 0 var(--primary); }

/* ── UPDATE BANNER ── */
.update-banner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  background: var(--primary);
  color: white;
  text-decoration: none;
  padding: 12px 16px;
  border-top: 3px solid #001d6e;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s;
  user-select: none;
}
.update-banner:hover  { background: var(--accent); }
.update-banner:active { opacity: 0.82; }
.update-banner-text {
  font-family: 'Archivo Black', sans-serif;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  line-height: 1;
}
.update-banner-arr {
  font-size: 16px;
  line-height: 1;
  opacity: 0.75;
  flex-shrink: 0;
}

/* ── FLOATING CARD + OVERLAY ── */
.fc-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  z-index: 1000;
  opacity: 0;
  transition: opacity 0.12s ease-out;
}
.float-card {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: white;
  border: 4px solid var(--primary);
  box-shadow: 4px 4px 0 rgba(0,0,30,0.3);
  padding: 18px 16px 16px;
  z-index: 1001;
  width: 320px;
  max-width: 90vw;
  opacity: 0;
  transition: opacity 0.12s ease-out;
}
.float-close {
  position: absolute;
  top: 8px;
  right: 8px;
  background: none;
  border: none;
  font-size: 16px;
  color: var(--primary);
  cursor: pointer;
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  line-height: 1;
  padding: 2px 5px;
}
.float-close:hover { color: var(--accent); }
.fc-date {
  font-family: 'Archivo Black', sans-serif;
  font-size: 13px;
  color: var(--primary);
  text-transform: uppercase;
  letter-spacing: 1px;
  border-bottom: 3px solid var(--primary);
  padding-bottom: 8px;
  margin-bottom: 10px;
  padding-right: 24px;
  line-height: 1.2;
}
.fc-section-lbl {
  font-family: 'Archivo Black', sans-serif;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
}
.fc-holiday {
  font-size: 10px;
  font-weight: 700;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-family: 'Oswald', sans-serif;
  margin-bottom: 2px;
}
.fc-event {
  background: var(--accent);
  color: white;
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  padding: 4px 7px;
  margin-bottom: 4px;
  border-radius: 1px;
  font-family: 'Roboto Condensed', sans-serif;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: background 0.12s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.fc-event:hover { background: var(--primary); }
.fc-event-chevron {
  font-size: 11px;
  opacity: 0.7;
  flex-shrink: 0;
  margin-left: 5px;
  font-style: normal;
  line-height: 1;
}
.fc-section-hint {
  font-size: 9px;
  color: #888;
  font-family: 'Roboto Condensed', sans-serif;
  font-style: italic;

}
.fc-empty {
  font-size: 11px;
  color: #888;
  font-family: 'Roboto Condensed', sans-serif;
  font-style: italic;
}

/* ── EVENT DETAIL MODAL (Layer 2) ── */
.ed-modal {
  display: none;           /* hidden by default — JS sets display:'flex' to open */
  flex-direction: column;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: white;
  border: 4px solid var(--primary);
  box-shadow: 4px 4px 0 rgba(0,0,30,0.3);
  z-index: 1002;
  width: 380px;
  max-width: 94vw;
  max-height: 90vh;
  opacity: 0;
  transition: opacity 0.12s ease-out;
  overflow: hidden;
}
.ed-header {
  background: var(--primary);
  padding: 9px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.ed-back-btn {
  background: none;
  border: none;
  color: white;
  cursor: pointer;
  padding: 3px 0;
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 5px;
  opacity: 0.85;
  transition: opacity 0.12s;
  -webkit-tap-highlight-color: transparent;
}
.ed-back-btn:hover { opacity: 1; }
.ed-back-btn svg { display: block; }
.ed-close-btn {
  background: none;
  border: none;
  color: white;
  cursor: pointer;
  font-size: 15px;
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  line-height: 1;
  padding: 2px 4px;
  opacity: 0.75;
  transition: opacity 0.12s;
  -webkit-tap-highlight-color: transparent;
}
.ed-close-btn:hover { opacity: 1; color: #ffcccc; }
.ed-body {
  padding: 18px 18px 20px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* ── SECTION 1: PRIMARY INFO ── */
.ed-event-name {
  font-family: 'Archivo Black', sans-serif;
  font-size: 18px;
  color: var(--primary);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  line-height: 1.2;
  margin-bottom: 10px;
}
.ed-date-loc {
  margin-bottom: 14px;
}
.ed-date-line {
  font-family: 'Oswald', sans-serif;
  font-weight: 600;
  font-size: 12px;
  color: #333;
  letter-spacing: 0.4px;
  line-height: 1.5;
}
.ed-loc-line {
  font-family: 'Roboto Condensed', sans-serif;
  font-size: 11px;
  color: #666;
  letter-spacing: 0.2px;
  line-height: 1.4;
  margin-top: 1px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;

}
.ed-island-badge {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: 7.5px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: #6680cc;
  border: 1px solid #b3c0e8;
  border-radius: 20px;
  padding: 1px 7px 1px 6px;
  line-height: 1.6;
  flex-shrink: 0;
  white-space: nowrap;
}
.ed-distances {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 14px;
}
.ed-dist-pill {
  background: var(--accent);
  color: white;
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.8px;
  padding: 4px 11px;
  border-radius: 2px;
  text-transform: uppercase;
}
.ed-reg-btn {
  display: block;
  width: 100%;
  background: var(--primary);
  color: white;
  font-family: 'Archivo Black', sans-serif;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  text-align: center;
  padding: 12px 12px;

/* ── RACE SCHEDULE ── */
.ed-schedule {
  margin-bottom: 14px;
}
.ed-schedule-lbl {
  font-family: 'Archivo Black', sans-serif;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--primary);
  margin-bottom: 6px;

}
.ed-schedule-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 4px;
}
.ed-schedule-dist {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: 11px;
  color: var(--accent);
  letter-spacing: 0.6px;

}
.ed-schedule-date {
  font-family: 'Roboto Condensed', sans-serif;
  font-size: 11px;
  color: #555;
  letter-spacing: 0.1px;
}

/* ── SECTION DIVIDER ── */
.ed-divider {
  border: none;
  border-top: 2px solid var(--primary);
  margin: 16px 0;
  opacity: 0.12;
}

/* ── SECTION 2: DECISION INFO ── */
.ed-decision {
  margin-bottom: 4px;
}
.ed-decision-block {
  margin-bottom: 12px;
}
.ed-decision-lbl {
  font-family: 'Archivo Black', sans-serif;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: #777;
  margin-bottom: 5px;
}
.ed-decision-rows {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.ed-decision-row {
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.ed-decision-dist {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: 10px;
  color: var(--accent);
  letter-spacing: 0.5px;
  min-width: 34px;
  flex-shrink: 0;
}
.ed-decision-val {
  font-family: 'Roboto Condensed', sans-serif;
  font-size: 11px;
  font-weight: 700;
  color: #222;

/* Tags row: difficulty + reg status */
.ed-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 4px;
}
.ed-tag {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: 9.5px;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  padding: 3px 9px;
  border-radius: 2px;
}
/* Difficulty variants */
.ed-tag-beginner   { background: #e8f5e9; color: #2e7d32; }
.ed-tag-intermediate { background: #fff3e0; color: #e65100; }
.ed-tag-technical  { background: #e8eaf6; color: #1a237e; }
.ed-tag-brutal     { background: #ffebee; color: #b71c1c; }
/* Reg status variants */
.ed-tag-open   { background: #e8f5e9; color: #2e7d32; }
.ed-tag-last   { background: #fff3e0; color: #e65100; }
.ed-tag-soldout { background: #ffebee; color: #b71c1c; }

/* ── SECTION 3: SUPPORTING INFO ── */
.ed-support {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.ed-support-row {
  display: flex;
  gap: 10px;
  align-items: baseline;
}
.ed-support-lbl {
  font-family: 'Archivo Black', sans-serif;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #888;
  min-width: 54px;
  flex-shrink: 0;
}
.ed-support-val {
  font-family: 'Roboto Condensed', sans-serif;
  font-size: 11px;
  color: #555;
  letter-spacing: 0.1px;
  line-height: 1.4;
}

/* ── COUNTDOWN TIMER — subtle secondary ── */
.ed-countdown {
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid #e8e8e8;
}
.ed-countdown-lbl {
  font-family: 'Archivo Black', sans-serif;
  font-size: 7px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: #bbb;
  margin-bottom: 6px;
}
.ed-cd-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
}
.ed-cd-unit {
  background: #f4f6fb;
  color: var(--primary);
  text-align: center;
  padding: 6px 2px 4px;
  border-radius: 2px;
}
.ed-cd-num {
  font-family: 'Archivo Black', sans-serif;
  font-size: 16px;
  line-height: 1;
  letter-spacing: 0.5px;
  display: block;
}
.ed-cd-lbl {
  font-family: 'Oswald', sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  opacity: 0.55;
  display: block;
  margin-top: 2px;
}
.ed-cd-done {
  background: var(--accent);
  color: white;
  font-family: 'Archivo Black', sans-serif;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 2px;
  text-align: center;
  padding: 8px 0;
  border-radius: 1px;
}
.ed-no-details {
  font-size: 11px;
  color: #888;
  font-family: 'Roboto Condensed', sans-serif;
  font-style: italic;
  margin-top: 4px;
}

/* emoji span — hidden on all breakpoints; mobile rule below is now redundant but kept for clarity */
.pill-emoji { display: none; }

/* event pill extras — mobile only (hidden on desktop) */
.pill-extra-mobile  { display: none; }
/* desktop more-badge shown; mobile variant hidden on desktop */
.more-badge-desktop { display: block; }
.more-badge-mobile  { display: none; }

/* ── MOBILE NAV ARROWS (hidden on desktop) ── */
.mob-nav-btn {
  display: none;
}

/* ── SCROLL INDICATOR ── */
.scroll-hint {
  display: none;
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 56px;
  color: var(--accent);
  opacity: 1;
  transition: opacity 0.4s;
  pointer-events: none;
  animation: bounce 1.5s ease-in-out infinite;
  z-index: 999;
  line-height: 1;
  user-select: none;
}
@keyframes bounce {
  0%, 100% { transform: translateX(-50%) translateY(0px); }
  50%       { transform: translateX(-50%) translateY(7px); }
}

/* ── SKELETON LOADING OVERLAY ── */
@keyframes cal-spin {
  to { transform: rotate(360deg); }
}
@keyframes skel-pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.45; }
}

.cal-loading-overlay {
  display: none;
  position: absolute;
  inset: 0;
  background: white;
  z-index: 50;
  flex-direction: column;
  pointer-events: all;
  opacity: 0;
  transition: opacity 0.18s ease;
}
.cal-loading-overlay.is-visible {
  display: flex;
}
.cal-loading-overlay.is-opaque {
  opacity: 1;
}

/* ── Inline progress bar — top of overlay, browser-style ── */
.skel-progress-track {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: rgba(0, 0, 0, 0.07);
  z-index: 1;
  overflow: hidden;
}
.skel-progress-fill {
  height: 100%;
  width: 0%;
  background: var(--primary);
  transition: width 0.3s ease;
  border-radius: 0 2px 2px 0;
}

/* ── Skeleton grid — mirrors the real 7-col calendar grid ── */
.skel-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  padding: 4px 2px 6px;
  margin: 0 6px 6px;
  gap: 2px;
  background: var(--primary);
  flex: 1;
}
.skel-cell {
  background: white;
  border-radius: 5px;
  padding: 6px 5px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  animation: skel-pulse 1.4s ease-in-out infinite;
}
/* Stagger the pulse so cells ripple, not all flash together */
.skel-cell:nth-child(7n+2) { animation-delay: 0.08s; }
.skel-cell:nth-child(7n+3) { animation-delay: 0.16s; }
.skel-cell:nth-child(7n+4) { animation-delay: 0.24s; }
.skel-cell:nth-child(7n+5) { animation-delay: 0.32s; }
.skel-cell:nth-child(7n+6) { animation-delay: 0.40s; }
.skel-cell:nth-child(7n+0) { animation-delay: 0.48s; }
.skel-cell.skel-blank { background: white; pointer-events: none; }

/* Date-number shimmer block */
.skel-num {
  width: 36px;
  height: 40px;
  background: #e8edf8;
  border-radius: 3px;
  flex-shrink: 0;
}
/* Event-pill shimmer block */
.skel-pill {
  width: 90%;
  height: 14px;
  background: #f0d0d5;
  border-radius: 2px;
  flex-shrink: 0;
}

/* ── Spinner + label — centred below the grid, inside the bottom strip area ── */
.skel-footer {
  padding: 16px 14px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-top: 3px solid var(--primary);
}
.skel-spinner {
  width: 22px;
  height: 22px;
  border: 2.5px solid rgba(0, 47, 167, 0.15);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: cal-spin 0.75s linear infinite;
  flex-shrink: 0;
}
.skel-label {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--primary);
  opacity: 0.6;
}

@media (min-width: 601px) {
  .cal-frame { position: relative; }
}

/* ═══════════════════════════════
   MOBILE  (≤ 600px)
   ═══════════════════════════════ */
@media (max-width: 600px) {
  body {
    padding: 0;
    /* Keep scrollable below-fold content above the nav bar + Android gesture strip */
    padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px));
    overflow-x: hidden;
  }

  /* Frame: full-width, left/right borders matching the sticky banner's 4px thickness */
  .cal-frame {
    max-width: 100%;
    border-left: 4px solid var(--primary);
    border-right: 4px solid var(--primary);
    box-shadow: none;
    display: flex;
    flex-direction: column;
  }

  /* Above-fold: fills the usable screen area — stops just short of the bottom blue divider
     so it is always visible, signalling scrollable content below.
     env(safe-area-inset-bottom) excludes the Android home/back gesture strip and any
     other system navigation area so the layout never intrudes into that region.
     viewport-fit=cover (set in the meta tag) is required for env() to return real values. */
  .above-fold {
    display: flex;
    flex-direction: column;
    position: relative;
    height: calc(100vh  - 56px - 3px);    /* Fallback: browsers without dvh or env() */
    height: calc(100dvh - 56px - 3px);    /* Fallback: dvh without env() support */
    height: calc(100dvh - 56px - env(safe-area-inset-bottom, 0px) - 3px); /* Preferred */
    overflow: clip;  /* clips visually without creating a scroll container,
                        so position:sticky on .top-banner propagates to the
                        page scroll context (matching desktop behaviour) */
  }

  /* Banner — mobile-optimised: logo and text fill the available height */
  .top-banner { padding: 0; gap: 0; flex-shrink: 0; }
  .banner-nav-btn { padding: 0 10px; }
  .banner-nav-btn svg { width: 22px; height: 22px; }
  .banner-logo-row svg { height: 28px; }
  .banner-logo-row .nav-btn { font-size: 16px; padding: 3px 10px; }
  .desktop-only { display: none !important; }
  .banner-center { gap: 8px; min-width: 0; padding: 5px 0; }
  .banner-logo { height: 24px; }
  .banner-text { border-left-width: 1.5px; padding-left: 9px; gap: 3px; overflow: hidden; min-width: 0; }
  .banner-sep { display: none; }
  .banner-title { font-size: 13px; letter-spacing: 0.8px; line-height: 1; flex-shrink: 0; }
  .banner-sub { font-size: 8.5px; letter-spacing: 0.4px; line-height: 1; }

  /* Month/year — tightened */
  .month-header { padding: 3px 4px; gap: 3px; flex-shrink: 0; }
  .year-box { font-size: 22px; padding: 1px 8px; }
  .month-name-box { font-size: 22px; letter-spacing: 2px; }
  .month-name-text { padding: 1px 8px; }
  .today-btn { font-size: 22px; padding: 1px 8px; letter-spacing: 1px; }

  /* Day headers — tightened */
  .day-headers { margin: 0 4px; padding: 2px; gap: 2px; flex-shrink: 0; }
  .dh { font-size: 11px; padding: 3px 0; border-radius: 3px; }

  /* Grid — takes all remaining space; rows stretch evenly to fill it */
  .cal-grid {
    flex: 1;
    min-height: 0;       /* critical: lets flex child shrink below content size */
    margin: 0 4px;
    padding: 2px;
    gap: 2px;
    align-content: stretch;   /* rows fill the container height */
    grid-auto-rows: 1fr;      /* each row takes equal share */
    margin-bottom: 0;
  }

  /* Cells — no fixed min-height; let the grid rows control height */
  .day-cell { min-height: 0; padding: 2px 3px; border-radius: 3px; overflow: hidden; }

  /* Date number — smaller */
  .date-num { font-size: 26px; line-height: 0.9; }

  /* Holiday label — flows below date number, plain red text */
  .holiday-lbl { font-size: 8px; letter-spacing: 0.1px; margin-top: 1px; }

  /* Event pill — no emoji (span hidden), truncated */
  .event-pill { font-size: 9px; padding: 1px 2px; margin-top: 1px; letter-spacing: 0; }
  .pill-emoji { display: none; }

  /* +N badge */
  .more-badge { font-size: 8px; margin-top: 0; }

  /* Bottom section — below the fold, full-width */
  .bottom-row { flex-shrink: 0; }
  .center-info { padding: 12px 0 12px; }
  .ev-header { padding: 0 8px 9px 12px; }
  .ev-title { font-size: 10px; letter-spacing: 1.5px; }
  .strip-nav-btn { width: 20px; height: 20px; }
  .strip-nav-btn svg { width: 11px; height: 11px; }
  .race-strip { padding: 10px 36px 12px 12px; gap: 8px; }
  .race-card { width: 144px; padding: 9px 10px 10px; }
  .rc-date { font-size: 9.5px; }
  .rc-name { font-size: 11.5px; }
  .rc-meta { font-size: 10px; }

  /* Event detail modal — full-screen feel on mobile */
  .ed-modal {
    width: 100%;
    max-width: 100%;
    max-height: 92vh;
    top: auto;
    bottom: 0;
    left: 0;
    transform: none;
    border-left: none;
    border-right: none;
    border-bottom: none;
    border-radius: 0;
  }
  .ed-body { padding: 16px 16px 24px; }
  .ed-event-name { font-size: 16px; }
  .ed-decision-block { margin-bottom: 10px; }

  /* Event pill extras — visible on mobile */
  .pill-extra-mobile { display: block; }
  /* Desktop more-badge hidden on mobile; mobile more-badge shown */
  .more-badge-desktop { display: none; }
  .more-badge-mobile  { display: block; }

  /* Mobile nav arrows */
  .mob-nav-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 32px;
    height: 64px;
    background: rgba(204, 0, 0, 0.13);
    color: var(--accent);
    border: none;
    font-size: 22px;
    font-weight: 900;
    cursor: pointer;
    z-index: 998;
    transition: background 0.18s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    line-height: 1;
    padding: 0;
  }
  .mob-nav-btn:active { background: rgba(204, 0, 0, 0.32); }
  .mob-nav-prev { left: 0; border-radius: 0 8px 8px 0; }
  .mob-nav-next { right: 0; border-radius: 8px 0 0 8px; }

  /* Scroll chevron visible on mobile */
  .scroll-hint { display: block; }

  /* On mobile, shift scroll-hint up above the nav bar */
  .scroll-hint { bottom: calc(56px + env(safe-area-inset-bottom, 0px) + 10px); }

  /* Search / Filter — mobile */
  .sf-bar { padding: 6px 12px 0; }
  .sf-toggle-btn { font-size: 10px; letter-spacing: 1px; padding: 6px 10px; }
  .sf-panel { padding: 10px 12px 12px; gap: 8px; }
  .sf-input { font-size: 11px; padding: 8px 10px; }
  .sf-chip { font-size: 9px; padding: 4px 9px; }

  /* Skeleton grid — match mobile cal-grid sizing */
  .skel-grid {
    flex: 1;
    min-height: 0;
    margin: 0 4px;
    padding: 2px;
    gap: 2px;
    align-content: stretch;
    grid-auto-rows: 1fr;
    margin-bottom: 0;
  }
  .skel-cell { border-radius: 3px; padding: 3px 3px; gap: 3px; }
  .skel-num  { width: 28px; height: 26px; }
  .skel-pill { height: 10px; }
}

/* ── BOTTOM NAV BAR ── */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 860px;
  height: calc(56px + env(safe-area-inset-bottom, 0px));
  background: #ffffff;
  border-top: 1px solid #e0e0e0;
  box-shadow: 0 -4px 16px rgba(0,0,0,0.08);
  display: flex;
  align-items: flex-start;
  z-index: 200;
  /* Prevent content from extending under iOS home indicator */
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

.bottom-nav-tab {
  flex: 1;
  /* 56px on mobile (Material 3 standard); scales to 60px on desktop
     to give the larger label comfortable vertical breathing room */
  height: clamp(56px, 7vw, 60px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  position: relative;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  min-height: 44px;
}

.bottom-nav-tab:active {
  background: rgba(0,0,0,0.04);
}

/* Vertical divider between tabs */
.bottom-nav-divider {
  width: 1px;
  height: calc(clamp(56px, 7vw, 60px) * 0.6);
  background: #e8e8e8;
  align-self: center;
  flex-shrink: 0;
}

/* Active indicator bar — top of tab */
.bottom-nav-tab::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 60%;
  height: 3px;
  border-radius: 0 0 3px 3px;
  background: transparent;
}

.bottom-nav-tab.is-active::before {
  background: var(--primary);
}

.bottom-nav-icon {
  font-size: 22px;
  line-height: 1;
  display: block;
  /* Inactive: grayscale + low opacity */
  filter: grayscale(100%);
  opacity: 0.35;
}

.bottom-nav-tab.is-active .bottom-nav-icon {
  filter: none;
  opacity: 1;
}

.bottom-nav-label {
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  /* Responsive: 12px on mobile (2026 WCAG / Material 3 nav bar minimum)
     scaling up to 14px on wide/desktop viewports. */
  font-size: clamp(12px, 3vw, 14px);
  /* Scale letter-spacing down slightly at smaller sizes to avoid cramping */
  letter-spacing: clamp(0.6px, 0.15vw, 1.2px);
  text-transform: uppercase;
  line-height: 1;
  color: #aaaaaa;
}

.bottom-nav-tab.is-active .bottom-nav-label {
  color: var(--primary);
}
</style>

<script>
// ── DATA ──────────────────────────────────────────────────
const PH_HOLIDAYS = {
  '2026-01-01': ["New Year's Day",      'Thu'],
  '2026-01-25': ['Chinese New Year',    'Sun'],
  '2026-02-25': ['EDSA Revolution',     'Wed'],
  '2026-04-02': ['Maundy Thursday',     'Thu'],
  '2026-04-03': ['Good Friday',         'Fri'],
  '2026-04-04': ['Black Saturday',      'Sat'],
  '2026-04-09': ['Araw ng Kagitingan',  'Thu'],
  '2026-05-01': ['Labor Day',           'Fri'],
  '2026-06-12': ['Independence Day',    'Fri'],
  '2026-08-21': ["Ninoy Aquino Day",    'Fri'],
  '2026-08-31': ['National Heroes Day', 'Mon'],
  '2026-11-01': ["All Saints' Day",     'Sun'],
  '2026-11-02': ["All Souls' Day",      'Mon'],
  '2026-11-30': ["Bonifacio Day",       'Mon'],
  '2026-12-08': ['Imm. Conception',     'Tue'],
  '2026-12-24': ['Christmas Eve',       'Thu'],
  '2026-12-25': ['Christmas Day',       'Fri'],
  '2026-12-30': ['Rizal Day',           'Wed'],
  '2026-12-31': ["New Year's Eve",      'Thu'],
};

// ── GOOGLE SHEET CSV URLS ─────────────────────────────────
const RACE_CSV_URL  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRgLX2R0c_LekofFvWcGKaoJvs6kdJQquTQ43-ZvWG6WoazU1ZBnF9SBPbVvDHc1dKD72xVDDkwfdhw/pub?gid=1550638156&single=true&output=csv';
const HIKE_CSV_URL  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRgLX2R0c_LekofFvWcGKaoJvs6kdJQquTQ43-ZvWG6WoazU1ZBnF9SBPbVvDHc1dKD72xVDDkwfdhw/pub?gid=1290848239&single=true&output=csv';
const RACE_FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSfhpuMI4T_9rXTtIwcS--tUYmDQgR8WwSObjJIxQ4rooj1XRg/viewform?usp=header';
const HIKE_FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSfS2x-PgVGihQsUaPwyQwnudNzVbx3Vbma5YRQjMNpH2b4dlA/viewform?usp=dialog';

// ── SESSION CACHE ─────────────────────────────────────────
// Each is null until first fetched; re-used on subsequent tab switches.
let raceData = null;   // { events, details }
let hikeData = null;   // { events, details }

// ── ACTIVE MODE ───────────────────────────────────────────
let currentMode = 'runs';

// These globals always reflect the ACTIVE mode's data.
// Swapped by switchMode() — all rendering functions read from here.
// These are populated by fetchSheetData() before first render
let TRAIL_EVENTS  = {};
let EVENT_DETAILS = {};

// ── CSV PARSER ────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
  return lines.slice(1).map(line => {
    // Handle quoted fields (fields may contain commas inside quotes)
    const fields = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { fields.push(cur.trim()); cur = ''; }
      else { cur += c; }
    }
    fields.push(cur.trim());
    const row = {};
    headers.forEach((h, i) => { row[h] = (fields[i] || '').replace(/^"|"$/g, '').trim(); });
    return row;
  }).filter(row => Object.values(row).some(v => v !== ''));
}

// ── RAW CSV PARSER (column-index based, for hike CSV) ─────
function parseCSVRaw(text) {
  return text.trim().split('\n').map(line => {
    const fields = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { fields.push(cur.trim()); cur = ''; }
      else { cur += c; }
    }
    fields.push(cur.trim());
    return fields.map(f => f.replace(/^"|"$/g, '').trim());
  });
}

// ── HIKE CSV → { events, details } ───────────────────────
// Uses named headers — column order in the sheet does not matter.
// Expected headers (exact match, case-sensitive):
//   Date, Event Name, Location, Island Group, Difficulty, Organizer,
//   Package Price, Inclusions, Meetup point, Reg Link, Max Slots, Schedule
function parseHikeData(csv) {
  const rows    = parseCSV(csv);   // header-keyed objects, order-independent
  const events  = {};
  const details = {};

  rows.forEach(row => {
    const date = (row['Date']       || '').trim();
    const name = (row['Event Name'] || '').trim();
    if (!date || !name) return;

    if (!events[date]) events[date] = [];
    events[date].push(name);

    details[name] = {
      location:     (row['Location']      || '').trim(),
      islandGroup:  (row['Island Group']  || '').trim(),
      difficulty:   (row['Difficulty']    || '').trim(),
      organizer:    (row['Organizer']     || '').trim(),
      packagePrice: (row['Package Price'] || '').trim(),
      inclusions:   (row['Inclusions']    || '').trim(),
      meetupPoint:  (row['Meetup point']  || '').trim(),
      regLink:      (row['Reg Link']      || '').trim(),
      maxSlots:     (row['Max Slots']     || '').trim(),
      schedule:     (row['Schedule']      || '').trim(),
      _isHike: true,
    };
  });

  return { events, details };
}

// ── FETCH & BUILD DATA ────────────────────────────────────
// ── CALENDAR LOADING OVERLAY UTILITIES ───────────────────
// Shared by both the initial race fetch and the hike tab fetch.
// Uses a RAF-driven simulated progress bar (same philosophy as the
// Uses a RAF-driven simulated progress bar — eases to ~88% on its own, snaps to 100% on hide.

let _calLoadingRaf = null;
let _calLoadingProgress = 0;

function calLoadingShow(label) {
  const overlay  = document.getElementById('cal-loading-overlay');
  const fill     = document.getElementById('skel-progress-fill');
  const labelEl  = document.getElementById('skel-label');

  if (!overlay) return;

  // Reset progress
  _calLoadingProgress = 0;
  if (fill) {
    fill.style.transition = 'none';
    fill.style.width = '0%';
  }
  if (labelEl) labelEl.textContent = label || 'Loading…';

  // Show overlay — use rAF to ensure display:flex is painted before opacity
  overlay.classList.add('is-visible');
  requestAnimationFrame(() => {
    overlay.classList.add('is-opaque');
  });

  // Animate progress bar
  cancelAnimationFrame(_calLoadingRaf);
  function tick() {
    _calLoadingProgress += (88 - _calLoadingProgress) * 0.045;
    if (fill) fill.style.width = _calLoadingProgress + '%';
    _calLoadingRaf = requestAnimationFrame(tick);
  }
  if (fill) fill.style.transition = 'width 0.3s ease';
  _calLoadingRaf = requestAnimationFrame(tick);
}

function calLoadingHide() {
  const overlay = document.getElementById('cal-loading-overlay');
  const fill    = document.getElementById('skel-progress-fill');

  cancelAnimationFrame(_calLoadingRaf);

  // Snap bar to 100%
  if (fill) {
    fill.style.transition = 'width 0.18s ease';
    fill.style.width = '100%';
  }

  // Fade out overlay after bar completes
  setTimeout(() => {
    if (overlay) overlay.classList.remove('is-opaque');
    setTimeout(() => {
      if (overlay) {
        overlay.classList.remove('is-visible');
        // Reset bar silently for next use
        if (fill) {
          fill.style.transition = 'none';
          fill.style.width = '0%';
        }
      }
    }, 200); // matches CSS transition duration
  }, 180);
}

async function fetchSheetData() {
  // ── Show skeleton overlay while race data loads ──────────
  calLoadingShow('Loading Trail Races…');

  try {
    const res = await fetch(RACE_CSV_URL);
    const csv = await res.text();
    const rows = parseCSV(csv);

    TRAIL_EVENTS  = {};
    EVENT_DETAILS = {};

    rows.forEach(row => {
      const date = (row['Date'] || '').trim();
      const name = (row['Event Name'] || '').trim();
      if (!date || !name) return;

      // Build TRAIL_EVENTS: { 'YYYY-MM-DD': ['Event Name', ...] }
      if (!TRAIL_EVENTS[date]) TRAIL_EVENTS[date] = [];
      TRAIL_EVENTS[date].push(name);

      // Build EVENT_DETAILS: { 'Event Name': { location, distances, regLink, elevation, organizer } }
      const distances = (row['Distances'] || '').split(',').map(d => d.trim()).filter(Boolean);

      const elevation = {};
      (row['Elevation'] || '').split('|').forEach(pair => {
        const [dist, gain] = pair.split(':').map(s => s.trim());
        if (dist && gain) elevation[dist] = gain;
      });

      // Schedule: built from Day 1 Distances / Day 2 Distances columns.
      // Day 1 date = the event's Date value (YYYY-MM-DD).
      // Day 2 date = Day 1 date + 1 calendar day (always derived, never hardcoded).
      const schedule = [];
      const day1Dist = (row['Day 1 Distances'] || '').trim();
      const day2Dist = (row['Day 2 Distances'] || '').trim();

      // Helper: format a YYYY-MM-DD string as "Mon D" (e.g. "Jun 27")
      function fmtScheduleDate(isoDate) {
        const [sy, sm, sd] = isoDate.split('-').map(Number);
        const dt = new Date(sy, sm - 1, sd);
        const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        return `${MON[dt.getMonth()]} ${sd} ${DOW[dt.getDay()]}`;
      }

      if (day1Dist) {
        schedule.push({ dist: day1Dist, date: fmtScheduleDate(date) });
      }

      if (day2Dist) {
        // Compute Day 2 = Day 1 + 1 calendar day
        const [d1y, d1m, d1d] = date.split('-').map(Number);
        const day2Date = new Date(d1y, d1m - 1, d1d + 1);
        const day2Key = `${day2Date.getFullYear()}-${pad(day2Date.getMonth()+1)}-${pad(day2Date.getDate())}`;
        schedule.push({ dist: day2Dist, date: fmtScheduleDate(day2Key) });
      }

      // Strip ", Philippines" (any casing/spacing) from end of location for display
      const rawLocation = (row['Location'] || '').trim();
      const displayLocation = rawLocation.replace(/,?\s*philippines\s*$/i, '').trim();

      EVENT_DETAILS[name] = {
        location:    displayLocation,
        distances,
        regLink:     (row['Reg Link']    || '').trim(),
        organizer:   (row['Organizer']   || '').trim(),
        islandGroup: (row['Island Group'] || '').trim(),
        elevation,
        schedule,
      };
    });

  } catch (err) {
    console.error('Failed to load race data from Google Sheets:', err);
  }

  // Cache the loaded race data for tab switching
  raceData = { events: TRAIL_EVENTS, details: EVENT_DETAILS };

  // Hide overlay, then render
  calLoadingHide();
  render();
  document.fonts.ready.then(updateStickyOffset);
}
const MONTHS = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE',
                'JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
const DAY_NAMES_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAYS_S = ['S','M','T','W','T','F','S'];

let cur = new Date(2026, 4, 1);

function pad(n) { return String(n).padStart(2, '0'); }
function key(y, m, d) { return `${y}-${pad(m+1)}-${pad(d)}`; }

// Strip emoji characters — used for mobile pill text
function stripEmoji(str) {
  return str.replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu, '').trim();
}

// ── SEARCH & FILTER STATE ────────────────────────────────
const sfState = {
  query:  '',
  island: 'all',
  status: 'all',
};

function toggleSearchPanel() {
  const panel  = document.getElementById('sf-panel');
  const btn    = document.getElementById('sf-toggle-btn');
  const isOpen = panel.classList.contains('is-open');
  panel.classList.toggle('is-open', !isOpen);
  panel.setAttribute('aria-hidden', isOpen ? 'true' : 'false');
  btn.classList.toggle('is-open', !isOpen);
  btn.setAttribute('aria-expanded', (!isOpen).toString());
  if (!isOpen) {
    const input = document.getElementById('sf-input');
    if (input) setTimeout(() => input.focus(), 50);
  }
}

function setFilter(key, value, chipEl) {
  sfState[key] = value;
  document.querySelectorAll(`.sf-chip[data-filter="${key}"]`)
    .forEach(c => c.classList.toggle('is-active', c === chipEl));
  applySearch();
}

function applySearch() {
  sfState.query = (document.getElementById('sf-input')?.value || '').trim().toLowerCase();
  const hasFilters = sfState.query || sfState.island !== 'all' || sfState.status !== 'all';
  const clearBtn = document.getElementById('sf-clear-btn');
  if (clearBtn) clearBtn.style.display = hasFilters ? '' : 'none';
  renderFilteredStrip();
}

function clearSearch() {
  sfState.query  = '';
  sfState.island = 'all';
  sfState.status = 'all';
  const input = document.getElementById('sf-input');
  if (input) input.value = '';
  document.querySelectorAll('.sf-chip').forEach(c => {
    c.classList.toggle('is-active', c.dataset.value === 'all');
  });
  document.getElementById('sf-clear-btn').style.display = 'none';
  document.getElementById('sf-results-label').textContent = '';
  renderFilteredStrip();
}

function renderFilteredStrip() {
  const { query, island, status } = sfState;
  const hasFilters = query || island !== 'all' || status !== 'all';

  if (!hasFilters) {
    // No active filters — normal month render
    render();
    updateResultsLabel('');
    return;
  }

  // ── Search is active: rebuild strip from ALL events across all months ──

  // Re-draw the calendar grid for the current month (navigation stays intact)
  const y = cur.getFullYear(), m = cur.getMonth();
  document.getElementById('yr-l').textContent     = y;
  document.getElementById('mon-name').textContent = MONTHS[m];
  const firstDow    = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const today       = new Date();
  let cells = Array(firstDow).fill(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7) cells.push(null);
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  cells.forEach((d, i) => {
    const div = document.createElement('div');
    div.className = 'day-cell';
    if (d === null) { div.classList.add('blank'); grid.appendChild(div); return; }
    const dow = i % 7, dk = key(y, m, d);
    const isSun = dow === 0, isHol = !!PH_HOLIDAYS[dk], evArr = TRAIL_EVENTS[dk] || [];
    const isToday = (y === today.getFullYear() && m === today.getMonth() && d === today.getDate());
    if (isSun)   div.classList.add('is-sun');
    if (isHol)   div.classList.add('is-holiday');
    if (isToday) div.classList.add('is-today');
    div.addEventListener('click', () => openCard(dk, d, m, y));
    div.innerHTML += `<div class="date-num-wrap"><div class="date-num">${d}</div></div>`;
    if (isHol) div.innerHTML += `<div class="holiday-lbl">${PH_HOLIDAYS[dk][0]}</div>`;
    if (evArr.length > 0) {
      div.innerHTML += `<div class="event-pill"><span class="pill-emoji">🏃 </span>${stripEmoji(evArr[0])}</div>`;
      const mobileMax = Math.min(evArr.length, 4);
      for (let pi = 1; pi < mobileMax; pi++) {
        div.innerHTML += `<div class="event-pill pill-extra-mobile">${stripEmoji(evArr[pi])}</div>`;
      }
      if (evArr.length > 1) div.innerHTML += `<div class="more-badge more-badge-desktop">+${evArr.length - 1}</div>`;
      if (evArr.length > 4) div.innerHTML += `<div class="more-badge more-badge-mobile">+${evArr.length - 4}</div>`;
    }
    grid.appendChild(div);
  });
  updateStickyOffset();
  updateTodayBtn();

  // Build flat list of ALL events across all months, sorted chronologically
  const MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const allCards = [];
  Object.entries(TRAIL_EVENTS)
    .sort(([a], [b]) => a.localeCompare(b))
    .forEach(([k, arr]) => {
      const parts = k.split('-').map(Number);
      const km = parts[1], kd = parts[2];
      const dateLabel = `${MONTH_ABBR[km - 1]} ${kd}`;
      arr.forEach(name => allCards.push({ k, name, dateLabel }));
    });

  // Filter against the full dataset
  const matchedCards = allCards.filter(({ name }) => {
    const det        = EVENT_DETAILS[name];
    const cardIsland = det ? (det.islandGroup || '') : '';
    const cardStatus = det ? (det.regStatus   || '') : '';
    const metaStr    = det
      ? (currentMode === 'hikes'
          ? [det.location || '', det.difficulty || ''].join(' ')
          : [det.location || '', (det.distances || []).join(' ')].join(' '))
      : '';
    const searchText = (name + ' ' + metaStr).toLowerCase();
    const matchesQuery  = !query  || searchText.includes(query);
    const matchesIsland = island === 'all' || cardIsland.toLowerCase().includes(island.toLowerCase());
    const matchesStatus = status === 'all' || cardStatus.toLowerCase() === status.toLowerCase();
    return matchesQuery && matchesIsland && matchesStatus;
  });

  // Rebuild the strip with global results
  const el = document.getElementById('center-info');
  const stripTitle = currentMode === 'hikes' ? 'ALL HIKES' : 'ALL TRAIL RACES';

  let h = `
    <div class="ev-header">
      <div class="ev-title">${stripTitle}</div>
      ${matchedCards.length > 0 ? `
      <div class="strip-nav" id="strip-nav">
        <button class="strip-nav-btn" id="strip-prev" onclick="stripNav(-1)" aria-label="Previous" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button class="strip-nav-btn" id="strip-next" onclick="stripNav(1)" aria-label="Next">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>` : ''}
    </div>`;

  if (matchedCards.length > 0) {
    h += `<div class="race-strip-wrap at-start" id="race-strip-wrap"><div class="race-strip" id="race-strip">`;
    matchedCards.forEach(({ k, name, dateLabel }) => {
      const det      = EVENT_DETAILS[name];
      const safeName = name.replace(/'/g, "\'").replace(/"/g, '&quot;');
      let metaStr;
      if (currentMode === 'hikes') {
        const hikeParts = det ? det.location.split(',') : [];
        const hikeLoc   = hikeParts.length >= 2 ? hikeParts[1].trim() : (hikeParts[0] ? hikeParts[0].trim() : '');
        metaStr = [hikeLoc, det ? det.difficulty : ''].filter(Boolean).join(' · ');
      } else {
        const parts    = det ? det.location.split(',') : [];
        const locShort = parts.length >= 2 ? parts[1].trim() : (parts[0] ? parts[0].trim() : '');
        const distStr  = det && det.distances ? det.distances.join(' / ') : '';
        metaStr = [locShort, distStr].filter(Boolean).join(' • ');
      }
      const cardIsland = det ? (det.islandGroup || '') : '';
      const cardStatus = det ? (det.regStatus   || '') : '';
      h += `<div class="race-card" data-island="${cardIsland}" data-status="${cardStatus}" onclick="openEventDetailFromList('${safeName}','${k}',this)">
              <div class="rc-date">${dateLabel}</div>
              <div class="rc-div"></div>
              <div class="rc-name">${name}</div>
              ${metaStr ? `<div class="rc-meta">${metaStr}</div>` : ''}
            </div>`;
    });
    h += `</div></div>`;
  } else {
    h += `<div class="race-strip-empty">No events match your search.</div>`;
  }

  el.innerHTML = h;
  if (matchedCards.length > 0) _initStripBehavior();

  if (matchedCards.length === 0) {
    updateResultsLabel('No events match your search.', false);
  } else {
    updateResultsLabel(`${matchedCards.length} event${matchedCards.length !== 1 ? 's' : ''} found`, true);
  }
}

function updateResultsLabel(text, hasResults = false) {
  const label = document.getElementById('sf-results-label');
  if (!label) return;
  label.textContent = text;
  label.classList.toggle('has-results', hasResults);
  label.classList.toggle('no-results', !hasResults && text.length > 0);
}

// ── RENDER ──────────────────────────────────────────────────
function render() {
  const y = cur.getFullYear(), m = cur.getMonth();
  document.getElementById('yr-l').textContent    = y;
  document.getElementById('mon-name').textContent = MONTHS[m];

  const firstDow    = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const today       = new Date();

  // Build cell array: leading blanks + days + trailing blanks
  let cells = Array(firstDow).fill(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7) cells.push(null);

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  cells.forEach((d, i) => {
    const div = document.createElement('div');
    div.className = 'day-cell';

    if (d === null) {
      div.classList.add('blank');
      grid.appendChild(div);
      return;
    }

    const dow     = i % 7;
    const dk      = key(y, m, d);
    const isSun   = dow === 0;
    const isHol   = !!PH_HOLIDAYS[dk];
    const evArr   = TRAIL_EVENTS[dk] || [];
    const isToday = (y === today.getFullYear() && m === today.getMonth() && d === today.getDate());

    if (isSun)   div.classList.add('is-sun');
    if (isHol)   div.classList.add('is-holiday');
    if (isToday) { div.classList.add('is-today'); }

    // Tap/click → floating detail card
    div.addEventListener('click', () => openCard(dk, d, m, y));

    // Date number
    div.innerHTML += `<div class="date-num-wrap"><div class="date-num">${d}</div></div>`;

    // Holiday label (top-right corner)
    if (isHol) {
      div.innerHTML += `<div class="holiday-lbl">${PH_HOLIDAYS[dk][0]}</div>`;
    }

    // Event pills
    // Desktop: 1 pill + desktop badge for extras
    // Mobile:  up to 4 pills + mobile badge if more than 4
    if (evArr.length > 0) {
      // Pill 1 — always shown (desktop + mobile)
      const p1 = stripEmoji(evArr[0]);
      div.innerHTML += `<div class="event-pill"><span class="pill-emoji">🏃 </span>${p1}</div>`;

      // Pills 2–4 — mobile only (pill-extra-mobile hidden on desktop)
      const mobileMax = Math.min(evArr.length, 4);
      for (let pi = 1; pi < mobileMax; pi++) {
        div.innerHTML += `<div class="event-pill pill-extra-mobile">${stripEmoji(evArr[pi])}</div>`;
      }

      // Desktop badge: total extras beyond pill 1
      if (evArr.length > 1) {
        div.innerHTML += `<div class="more-badge more-badge-desktop">+${evArr.length - 1}</div>`;
      }
      // Mobile badge: extras beyond 4 pills
      if (evArr.length > 4) {
        div.innerHTML += `<div class="more-badge more-badge-mobile">+${evArr.length - 4}</div>`;
      }
    }

    grid.appendChild(div);
  });

  renderCenter(y, m, today);
  updateStickyOffset();
  updateTodayBtn();
}

function renderCenter(y, m, today) {
  const el = document.getElementById('center-info');

  // Chronological order — sort by ISO date key ascending
  const evs = Object.entries(TRAIL_EVENTS).filter(([k]) => {
    const [ky, km] = k.split('-').map(Number);
    return ky === y && km === m + 1;
  }).sort(([a], [b]) => a.localeCompare(b));

  // Build flat list of all events in chrono order
  const allCards = [];
  evs.forEach(([k, arr]) => {
    const d         = parseInt(k.split('-')[2]);
    const dateLabel = `${MONTHS[m].slice(0,3)} ${d}`;
    arr.forEach(name => {
      allCards.push({ k, name, dateLabel });
    });
  });

  const hasEvents = allCards.length > 0;

  const stripTitle = currentMode === 'hikes' ? 'HIKES THIS MONTH' : 'TRAIL RACES THIS MONTH';
  const hikeLoadFailed = currentMode === 'hikes' && hikeData && hikeData._loadError;
  const emptyMsg   = hikeLoadFailed
    ? 'Could not load hike events. Please check your connection and try again.'
    : currentMode === 'hikes' ? 'No hikes this month.' : 'No trail events this month.';

  let h = `
    <div class="ev-header">
      <div class="ev-title">${stripTitle}</div>
      ${hasEvents ? `
      <div class="strip-nav" id="strip-nav">
        <button class="strip-nav-btn" id="strip-prev" onclick="stripNav(-1)" aria-label="Previous races" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button class="strip-nav-btn" id="strip-next" onclick="stripNav(1)" aria-label="Next races">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>` : ''}
    </div>`;

  if (hasEvents) {
    h += `<div class="race-strip-wrap at-start" id="race-strip-wrap">
            <div class="race-strip" id="race-strip">`;

    allCards.forEach(({ k, name, dateLabel }) => {
      const det      = EVENT_DETAILS[name];
      const safeName = name.replace(/'/g, "\'").replace(/"/g, '&quot;');
      let metaStr;
      if (currentMode === 'hikes') {
        const parts = det ? det.location.split(',') : [];
        const loc   = parts.length >= 2 ? parts[1].trim() : (parts[0] ? parts[0].trim() : '');
        const diff  = det ? det.difficulty : '';
        metaStr = [loc, diff].filter(Boolean).join(' · ');
      } else {
        const parts   = det ? det.location.split(',') : [];
        const locShort = parts.length >= 2 ? parts[1].trim() : (parts[0] ? parts[0].trim() : '');
        const distStr  = det && det.distances ? det.distances.join(' / ') : '';
        metaStr = [locShort, distStr].filter(Boolean).join(' • ');
      }

      const cardIsland = det ? (det.islandGroup || '') : '';
      const cardStatus = det ? (det.regStatus   || '') : '';

      h += `<div class="race-card" data-island="${cardIsland}" data-status="${cardStatus}" onclick="openEventDetailFromList('${safeName}','${k}',this)">
              <div class="rc-date">${dateLabel}</div>
              <div class="rc-div"></div>
              <div class="rc-name">${name}</div>
              ${metaStr ? `<div class="rc-meta">${metaStr}</div>` : ''}
            </div>`;
    });

    h += `    </div>
          </div>`;
  } else {
    h += `<div class="race-strip-empty">${emptyMsg}</div>`;
  }

  el.innerHTML = h;

  if (hasEvents) {
    _initStripBehavior();
  }
}

// ── STRIP BEHAVIOR: scroll sync, edge fades, mouse drag ──────────────────────
function _initStripBehavior() {
  const strip = document.getElementById('race-strip');
  const wrap  = document.getElementById('race-strip-wrap');
  const prev  = document.getElementById('strip-prev');
  const next  = document.getElementById('strip-next');
  if (!strip || !wrap) return;

  // Card scroll step — width of one card + gap
  const STEP = 160;

  // Update arrow state + edge-fade classes based on scroll position
  function syncState() {
    const { scrollLeft, scrollWidth, clientWidth } = strip;
    const atStart = scrollLeft <= 2;
    const atEnd   = scrollLeft >= scrollWidth - clientWidth - 2;

    wrap.classList.toggle('at-start', atStart);
    wrap.classList.toggle('at-end',   atEnd);
    wrap.classList.toggle('scrolled', !atStart);

    if (prev) prev.disabled = atStart;
    if (next) next.disabled = atEnd;
  }

  strip.addEventListener('scroll', syncState, { passive: true });
  // Run once on init
  syncState();
  // Run again after images/fonts settle
  setTimeout(syncState, 300);

  // ── MOUSE DRAG ────────────────────────────────────────────
  let dragStartX    = 0;
  let dragScrollLeft = 0;
  let isDragging    = false;
  let didDrag       = false;

  strip.addEventListener('mousedown', e => {
    // Only left button, not on interactive children
    if (e.button !== 0) return;
    isDragging     = true;
    didDrag        = false;
    dragStartX     = e.pageX - strip.offsetLeft;
    dragScrollLeft = strip.scrollLeft;
    strip.classList.add('is-dragging');
  });

  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const x    = e.pageX - strip.offsetLeft;
    const walk = (x - dragStartX) * 1.2;
    if (Math.abs(walk) > 4) didDrag = true;
    strip.scrollLeft = dragScrollLeft - walk;
  });

  window.addEventListener('mouseup', () => {
    if (!isDragging) return;
    isDragging = false;
    strip.classList.remove('is-dragging');
  });

  // Prevent click-firing on cards after a drag
  strip.addEventListener('click', e => {
    if (didDrag) {
      e.stopImmediatePropagation();
      didDrag = false;
    }
  }, true);
}

// ── STRIP ARROW NAV ────────────────────────────────────────
function stripNav(dir) {
  const strip = document.getElementById('race-strip');
  if (!strip) return;
  const STEP = 158 + 8; // card width + gap
  strip.scrollBy({ left: dir * STEP * 3, behavior: 'smooth' });
}

function shift(dir) {
  cur.setMonth(cur.getMonth() + dir);
  render();
}

function jumpToToday() {
  const now = new Date();
  cur = new Date(now.getFullYear(), now.getMonth(), 1);

}

function updateTodayBtn() {

  if (!btn) return;
  const now = new Date();
  const isCurrentMonth = (cur.getFullYear() === now.getFullYear() && cur.getMonth() === now.getMonth());

// ── FLOATING CARD ─────────────────────────────────────────
function openCard(dk, d, m, y) {
  const overlay = document.getElementById('fc-overlay');
  const card    = document.getElementById('float-card');
  const dateEl  = document.getElementById('fc-date');
  const bodyEl  = document.getElementById('fc-body');

  // Full date string
  const dow = new Date(y, m, d).getDay();
  dateEl.textContent = `${DAY_NAMES_FULL[dow]}, ${MONTHS[m].slice(0,3)} ${d}, ${y}`;

  // If the day has exactly one event, skip the intermediate card and go straight to detail
  const evArr = TRAIL_EVENTS[dk] || [];
  if (evArr.length === 1) {
    _listModeActive = true;
    overlay.style.display = 'block';
    requestAnimationFrame(() => requestAnimationFrame(() => { overlay.style.opacity = '1'; }));
    openEventDetail(evArr[0], dk);
    return;
  }

  let content = '';

  // Holiday
  if (PH_HOLIDAYS[dk]) {
    content += `<div class="fc-section-lbl" style="color:var(--accent)">Legal Holiday</div>`;
    content += `<div class="fc-holiday">${PH_HOLIDAYS[dk][0]}</div>`;
  }

  // All events
  if (evArr.length) {
    const evSectionLbl = currentMode === 'hikes' ? 'Hike Events' : 'Trail Events';
    content += `<div class="fc-section-lbl" style="color:var(--primary);margin-top:${PH_HOLIDAYS[dk] ? 10 : 0}px">${evSectionLbl}</div>`;
    content += `<div class="fc-section-hint">Tap an event for details</div>`;
    evArr.forEach(ev => {
      const safeName = ev.replace(/'/g, "\\'").replace(/"/g, '&quot;');
      content += `<div class="fc-event" onclick="openEventDetail('${safeName}','${dk}')"><span>${ev}</span><span class="fc-event-chevron">›</span></div>`;
    });
  }

  if (!content) {
    content = '<div class="fc-empty">No events or holidays on this day.</div>';
  }

  bodyEl.innerHTML = content;

  // Show with 120ms ease-out fade
  overlay.style.display = 'block';
  card.style.display    = 'block';
  // Double rAF: ensures display:block paints before opacity transition fires
  requestAnimationFrame(() => requestAnimationFrame(() => {
    overlay.style.opacity = '1';
    card.style.opacity    = '1';
  }));
}

function closeCard() {
  const overlay = document.getElementById('fc-overlay');
  const card    = document.getElementById('float-card');
  const edModal = document.getElementById('ed-modal');
  _clearCountdown();
  // Close detail layer immediately (no fade needed — card fades out underneath)
  if (edModal) { edModal.style.opacity = '0'; edModal.style.display = 'none'; }
  overlay.style.opacity = '0';
  card.style.opacity    = '0';
  setTimeout(() => {
    overlay.style.display = 'none';
    card.style.display    = 'none';
  }, 120);
}

// Overlay tap: dismiss only the top-most visible layer
function handleOverlayClick() {
  const edModal = document.getElementById('ed-modal');
  if (edModal && edModal.style.display !== 'none' && edModal.style.opacity !== '0') {
    closeEventDetail();
  } else {
    closeCard();
  }
}

function _startCountdown(dk, dayLabel) {
  dayLabel = dayLabel || 'Race Day!';
  const cdEl = document.getElementById('ed-countdown');
  if (!cdEl || !dk) return;
  const [cy, cm, cd] = dk.split('-').map(Number);
  const pad2   = n => String(n).padStart(2, '0');

  // If the event date is strictly in the past, show motivational message
  const today    = new Date();
  const todayKey = `${today.getFullYear()}-${pad2(today.getMonth()+1)}-${pad2(today.getDate())}`;
  if (dk < todayKey) {
    cdEl.innerHTML = '<div class="ed-cd-done">Well Done. You showed up.</div>';
    return;
  }

  const target = new Date(cy, cm - 1, cd).getTime();

  function tickCountdown() {
    const diff = target - Date.now();
    if (diff <= 0) {
      cdEl.innerHTML = `<div class="ed-cd-done">&#127937; ${dayLabel}</div>`;
      _clearCountdown();
      return;
    }
    const totalSec = Math.floor(diff / 1000);
    const days  = Math.floor(totalSec / 86400);
    const hours = Math.floor((totalSec % 86400) / 3600);
    const mins  = Math.floor((totalSec % 3600)  / 60);
    const secs  = totalSec % 60;
    cdEl.innerHTML =
      `<div class="ed-countdown-lbl">Countdown to ${dayLabel}</div>
       <div class="ed-cd-grid">
         <div class="ed-cd-unit"><span class="ed-cd-num">${days}</span><span class="ed-cd-lbl">Days</span></div>
         <div class="ed-cd-unit"><span class="ed-cd-num">${pad2(hours)}</span><span class="ed-cd-lbl">Hours</span></div>
         <div class="ed-cd-unit"><span class="ed-cd-num">${pad2(mins)}</span><span class="ed-cd-lbl">Mins</span></div>
         <div class="ed-cd-unit"><span class="ed-cd-num">${pad2(secs)}</span><span class="ed-cd-lbl">Secs</span></div>
       </div>`;
  }
  tickCountdown();
  _countdownTimer = setInterval(tickCountdown, 1000);
}
