  modal.style.opacity = '0';
  setTimeout(() => { modal.style.display = 'none'; }, 120);
  // When opened from the bottom list there is no day-card underneath —
  // dismiss the overlay in the same action so it takes only one tap to close.
  if (_listModeActive) {
    _listModeActive = false;
    // Clear the list row's selected indicator now that the modal is dismissed.
    document.querySelectorAll('.hol-row.is-selected')
            .forEach(r => r.classList.remove('is-selected'));
    overlay.style.opacity = '0';
    setTimeout(() => { overlay.style.display = 'none'; }, 120);
  }
}

// ── OPEN FROM BOTTOM LIST ─────────────────────────────────
// Called when the user taps an event row in the "Upcoming Trail Events" list.
// Formats the date from the TRAIL_EVENTS key, pre-fills fc-date so the shared
// openEventDetail() can read it, then shows the overlay + detail modal directly
// (bypassing the day-card layer which is not relevant here).
function openEventDetailFromList(eventName, dk, el) {
  // ── Selection indicator ──────────────────────────────────
  // Clear any previously selected row, then mark this one.
  document.querySelectorAll('.hol-row.is-selected')
          .forEach(r => r.classList.remove('is-selected'));
  if (el) el.classList.add('is-selected');

  _listModeActive = true;

  // Build a human-readable date string from the ISO key (e.g. '2026-05-09')
  const parts = dk.split('-').map(Number);          // [2026, 5, 9]
  const y = parts[0], m = parts[1] - 1, d = parts[2];
  const dow = new Date(y, m, d).getDay();
  const formattedDate = `${DAY_NAMES_FULL[dow]}, ${MONTHS[m].slice(0,3)} ${d}, ${y}`;

  // Pre-fill the shared date element that openEventDetail() reads
  document.getElementById('fc-date').textContent = formattedDate;

  // Show the overlay (normally shown by openCard; we replicate that here)
  const overlay = document.getElementById('fc-overlay');
  overlay.style.display = 'block';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    overlay.style.opacity = '1';
  }));

  // Delegate to the existing detail-modal logic
  openEventDetail(eventName, dk);
}

// ── SCROLL CHEVRON ────────────────────────────────────────
const scrollHint = document.getElementById('scroll-hint');
window.addEventListener('scroll', () => {
  if (scrollHint) scrollHint.style.opacity = window.scrollY > 40 ? '0' : '1';
}, { passive: true });

// Tapping the chevron scrolls down to the bottom section
if (scrollHint) {
  scrollHint.style.pointerEvents = 'auto';
  scrollHint.style.cursor = 'pointer';
  scrollHint.addEventListener('click', () => {
    const bottomRow = document.querySelector('.bottom-row');
    if (bottomRow) bottomRow.scrollIntoView({ behavior: 'smooth' });
  });
}

// ── MOBILE SWIPE NAVIGATION ────────────────────────────────
(function () {
  let tx = 0, ty = 0, swiped = false;
  const target = document.querySelector('.above-fold') || document.querySelector('.cal-grid');
  if (!target) return;

  target.addEventListener('touchstart', e => {
    tx = e.touches[0].clientX;
    ty = e.touches[0].clientY;
    swiped = false;
  }, { passive: true });

  target.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx;
    const dy = e.changedTouches[0].clientY - ty;
    // Fire only on clearly horizontal swipes (>55px, more horizontal than vertical)
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.6) {
      swiped = true;
      shift(dx < 0 ? 1 : -1);
    }
  }, { passive: true });
})();

// ── DESKTOP TOUCHPAD SWIPE (wheel deltaX) ─────────────────
(function () {
  // Only wire up on non-touch devices (pointer: fine = mouse/trackpad)
  if (!window.matchMedia('(pointer: fine)').matches) return;

  let accumulated = 0;
  let debounce    = null;
  let locked      = false;          // prevent double-fire within cooldown
  const THRESHOLD = 60;             // px of horizontal scroll to trigger
  const COOLDOWN  = 600;            // ms before another shift is allowed

  const frame = document.querySelector('.cal-frame');
  if (!frame) return;

  frame.addEventListener('wheel', e => {
    // Ignore predominantly vertical scrolls (e.g. normal page scroll)
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) return;

    e.preventDefault();             // stop the page from panning horizontally
    if (locked) return;

    accumulated += e.deltaX;

    clearTimeout(debounce);
    debounce = setTimeout(() => {
      if (Math.abs(accumulated) >= THRESHOLD) {
        shift(accumulated > 0 ? 1 : -1);
        locked = true;
        setTimeout(() => { locked = false; }, COOLDOWN);
      }
      accumulated = 0;
    }, 80);
  }, { passive: false });
})();

// ── DESKTOP KEYBOARD ARROW NAVIGATION ─────────────────────
(function () {
  // Only wire up on non-touch devices (pointer: fine = mouse/trackpad)
  if (!window.matchMedia('(pointer: fine)').matches) return;

  document.addEventListener('keydown', e => {
    // Ignore when focus is inside a text field or interactive element
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

    if (e.key === 'ArrowLeft')  { e.preventDefault(); shift(-1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); shift( 1); }
  });
})();

// ── MODE SWITCHING (Trail Runs ↔ Hikes) ───────────────────
async function switchMode(mode) {
  // No-op if already on this mode (prevents re-fetch flicker)
  if (mode === currentMode) return;

  // ── Clear search + filters on every tab switch ──────────
  // Mirrors clearSearch() but skips renderFilteredStrip()
  // since switchMode calls render() itself at the end.
  sfState.query  = '';
  sfState.island = 'all';
  sfState.status = 'all';

  const sfInput = document.getElementById('sf-input');
  if (sfInput) sfInput.value = '';

  // Reset chips: deactivate all, re-activate the "all" chips
  document.querySelectorAll('.sf-chip').forEach(c => {
    c.classList.toggle('is-active', c.dataset.value === 'all');
  });

  // Hide the CLEAR button
  const sfClearBtn = document.getElementById('sf-clear-btn');
  if (sfClearBtn) sfClearBtn.style.display = 'none';

  // Collapse the search panel if it is open
  const sfPanel   = document.getElementById('sf-panel');
  const sfToggle  = document.getElementById('sf-toggle-btn');
  if (sfPanel && sfPanel.classList.contains('is-open')) {
    sfPanel.classList.remove('is-open');
    sfPanel.setAttribute('aria-hidden', 'true');
    if (sfToggle) {
      sfToggle.classList.remove('is-open');
      sfToggle.setAttribute('aria-expanded', 'false');
    }
  }

  updateResultsLabel('');

  const html     = document.documentElement;
  const tabRuns  = document.getElementById('tabRuns');
  const tabHikes = document.getElementById('tabHikes');
  const banner   = document.getElementById('update-banner');
  const grid     = document.getElementById('cal-grid');

  // ── Color identity ──────────────────────────────────────
  if (mode === 'hikes') {
    html.classList.add('hike-mode');
  } else {
    html.classList.remove('hike-mode');
  }

  // ── Tab UI ──────────────────────────────────────────────
  tabRuns.classList.toggle('is-active',  mode === 'runs');
  tabHikes.classList.toggle('is-active', mode === 'hikes');
  tabRuns.setAttribute('aria-selected',  mode === 'runs'  ? 'true' : 'false');
  tabHikes.setAttribute('aria-selected', mode === 'hikes' ? 'true' : 'false');

  // ── Banner subtitle ─────────────────────────────────────
  document.getElementById('bannerSub').textContent = mode === 'hikes'
    ? 'Upcoming Hikes & Treks Sa Pinas'
    : 'Upcoming Trail Races Sa Pinas';

  // ── Update-banner link ──────────────────────────────────
  if (banner) banner.href = mode === 'hikes' ? HIKE_FORM_URL : RACE_FORM_URL;

  currentMode = mode;

  // ── Update strip title immediately (before fetch/render) ─
  const evTitleEl = document.querySelector('.ev-title');
  if (evTitleEl) evTitleEl.textContent = mode === 'hikes' ? 'HIKES THIS MONTH' : 'TRAIL RACES THIS MONTH';

  // ── Fetch (if not yet cached) & swap globals ────────────
  if (mode === 'hikes') {
    if (!hikeData) {
      calLoadingShow('Loading Hikes…');
      grid.style.pointerEvents = 'none';
      try {
        const res = await fetch(HIKE_CSV_URL);
        const csv = await res.text();
        hikeData  = parseHikeData(csv);
      } catch (err) {
        console.error('Failed to load hike data:', err);
        hikeData = { events: {}, details: {}, _loadError: true };
      }
      calLoadingHide();
      grid.style.pointerEvents = '';
    }
    TRAIL_EVENTS  = hikeData.events;
    EVENT_DETAILS = hikeData.details;
  } else {
    // Restore race data (always available — loaded on page start)
    if (raceData) {
      TRAIL_EVENTS  = raceData.events;
      EVENT_DETAILS = raceData.details;
    }
  }

  // ── Re-render ───────────────────────────────────────────
  render();
}
</script>
